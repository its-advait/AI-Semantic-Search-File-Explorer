version: '3.8'

services:
  ai-file-explorer:
    build: .
    ports:
      - "8090:8090"  # PocketBase API
      - "8081:8081"  # MCP Server
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MCP_PORT=8081
    volumes:
      - ./data:/app/data
      - ./extensions:/app/extensions
      - ./test-files:/app/test-files:ro  # Mount test files for crawling
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8090/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: Add a simple web UI for testing
  web-ui:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
    depends_on:
      - ai-file-explorer
    restart: unless-stopped

volumes:
  data:
    driver: local
